name: Preview actual video settings component
on:
  push:
    branches: [preview/video-settings-79d83e1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Compile real video node and preview component
        run: |
          bun run --cwd packages/nodes/videoGenerationNode typecheck
          bun run --cwd packages/nodes/videoGenerationNode build
          bun run --cwd apps/web vite build --config preview-h3/vite.config.ts
      - name: Run browser capture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/mangaflow-browser" --no-audit --no-fund playwright@1.51.1
          cp apps/web/preview-h3/capture.mjs "$RUNNER_TEMP/mangaflow-browser/capture.mjs"
          bun run --cwd apps/web vite preview --config preview-h3/vite.config.ts --host 127.0.0.1 --port 4173 --strictPort > /tmp/h3-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          mkdir -p "$GITHUB_WORKSPACE/preview-screenshots"
          node "$RUNNER_TEMP/mangaflow-browser/capture.mjs" "$GITHUB_WORKSPACE/preview-screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mangaflow-real-vue-preview
          path: preview-screenshots
          if-no-files-found: warn
