name: Typecheck

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: 核对生产链路 TypeScript 和 Vue 类型
        run: bun run --filter '@toonflow/server' --filter '@toonflow/node-video-generation' --filter '@toonflow/tools-scaffold' --filter '@toonflow/tool-media-generation' typecheck
