name: Typecheck

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: 校验自动路由表与所有源码接口一致
        run: |
          bun run --cwd apps/server routes
          git diff --exit-code -- apps/server/src/router.ts
          bun -e 'const x=await Bun.file("apps/server/src/router.ts").text(); for(const route of ["/api/providers/thinkingProbe","/api/agent/steer","/api/production/comfyui/loras"]) if(!x.includes(`app.use("${route}"`)) throw Error(`缺少路由：${route}`);'
      - name: 核对服务端类型
        run: bun run --cwd apps/server typecheck
      - name: 核对 Web 对话界面类型
        run: bun run --cwd apps/web typecheck
      - name: 核对节点及媒体工具类型
        run: |
          bun run --cwd packages/toolScaffold typecheck
          bun run --cwd packages/tools/mediaGeneration typecheck
          bun run --cwd packages/nodes/videoGenerationNode typecheck
      - name: 生产链路回归测试
        working-directory: apps/server
        run: bun test src/utils/production/qcResult.test.ts src/utils/production/comfyui.test.ts src/utils/production/generationJobs.test.ts src/utils/ai/thinkingProbe.test.ts src/agent/runtime/steering.test.ts
