name: MangaFlow Windows Release
run-name: MangaFlow Windows ${{ inputs.version || '2.0.18' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Windows 安装包版本号（X.Y.Z）
        required: true
        type: string
        default: "2.0.18"
  # 更新此工作流触发 Windows 专用构建；以后也可手动发布新版本。
  push:
    branches: [master]
    paths:
      - ".github/workflows/windowsRelease.yml"

permissions:
  contents: read

concurrency:
  group: mangaflow-windows-release
  cancel-in-progress: false

jobs:
  build:
    name: 构建 Windows x64
    uses: ./.github/workflows/debug.yml
    with:
      target: windowsX64
      ref: ${{ github.sha }}
      version: ${{ inputs.version || '2.0.18' }}
      generatePatch: false
      androidRelease: false

  publish:
    name: 发布 Windows EXE
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v8
        with:
          name: toonflow-${{ needs.build.outputs.version }}-windowsX64
          path: artifacts
      - name: 核对唯一 Windows 安装包
        env:
          releaseVersion: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          installer="artifacts/mangaflow-${releaseVersion}-Setup.exe"
          test -s "$installer"
          actualCount="$(find artifacts -maxdepth 1 -type f -name '*.exe' | wc -l)"
          if [ "$actualCount" -ne 1 ]; then
            echo "::error::Windows 安装包数量应为 1，实际为 ${actualCount}"
            exit 1
          fi
      - name: 发布 GitHub Release（仅 EXE）
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ needs.build.outputs.commit }}
          name: MangaFlow v${{ needs.build.outputs.version }} · Windows
          body: |
            Windows x64 安装包。
            恢复画布优先制作：常规出图、出视频和继续制作只通过画布生成节点执行，只有明确请求对话直出才开放聊天媒体生成工具；保留节点提示词、参考连线和生成结果。
            复用原 searchVideoPromptTemplates 分类检索工具，新增2026中国网络热梗与原创抽象搞怪提示词分类（listCreativeTags/searchCreative），保留旧视频导演模板接口与独立审查链。
            热梗只收录有2026日期记录的词条，截至2026-11-11，标注来源及场景；删除混入的2025回顾内容；同步更新工作流Skill和项目README。
            保留 Pi SDK 原生不中断引导、彩色思考等级滑块与 QC 整改方案。
            继续包含 TryCloudflare 隧道连接恢复与诊断日志修复。
            只发布 Windows EXE，不包含 macOS 或 Android 安装包。
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: artifacts/mangaflow-${{ needs.build.outputs.version }}-Setup.exe
