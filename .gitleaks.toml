title = "Mangaflow"

[extend]
useDefault = true

[[rules]]
id = "mangaflow-sk-sp"
description = "sk-sp credential"
regex = '''sk-sp-[A-Za-z0-9._~+/-]{16,}'''
keywords = ["sk-sp-"]

