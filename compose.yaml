services:
  toonflow:
    build: .
    init: true
    restart: unless-stopped
    ports:
      # 只把宿主机环回地址映射进容器。容器内进程通过 TOONFLOW_HOST 监听所有网卡。
      - "127.0.0.1:3000:3000"
    # Linux Docker 中可用 host.docker.internal 访问宿主机上已允许容器访问的 ComfyUI。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 容器内监听 0.0.0.0。宿主机端口只映射到环回地址，进程仍要求访问令牌。
      TOONFLOW_TOKEN: ${TOONFLOW_TOKEN:?请设置至少 32 位的 TOONFLOW_TOKEN}
      TOONFLOW_PUBLIC_URL: ${TOONFLOW_PUBLIC_URL:-}
    volumes:
      - toonflowData:/app/data

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [toonflow]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TOONFLOW_DOMAIN: ${TOONFLOW_DOMAIN:-}
    volumes:
      - ./deploy/caddyConfig:/etc/caddy/Caddyfile:ro
      - caddyData:/data
      - caddyConfig:/config

  # 局域网可选模式：不暴露 3000，也不使用公网 CA。需在客户端信任此部署的根证书。
  caddy-lan:
    image: caddy:2
    profiles: ["lan"]
    restart: unless-stopped
    depends_on: [toonflow]
    ports:
      - "${MANGAFLOW_LAN_IP:-127.0.0.1}:3443:3443"
    environment:
      MANGAFLOW_LAN_IP: ${MANGAFLOW_LAN_IP:-127.0.0.1}
    volumes:
      - ./deploy/caddyLanConfig:/etc/caddy/Caddyfile:ro
      - caddyLanData:/data
      - caddyLanConfig:/config

volumes:
  toonflowData:
  caddyData:
  caddyConfig:
  caddyLanData:
  caddyLanConfig:
