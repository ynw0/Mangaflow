# 离线发行包：已包含两个 Linux amd64 镜像，禁止下载和构建。
services:
  toonflow:
    image: mangaflow/server:${MANGAFLOW_VERSION:?请使用发行包自带版本配置}
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TOONFLOW_TOKEN: ${TOONFLOW_TOKEN:?请设置至少32位访问令牌}
      TOONFLOW_PUBLIC_URL: ${TOONFLOW_PUBLIC_URL:-}
    volumes:
      - toonflowData:/app/data

  caddy-lan:
    image: mangaflow/lan-proxy:${MANGAFLOW_VERSION:?请使用发行包自带版本配置}
    pull_policy: never
    profiles: ["lan"]
    restart: unless-stopped
    depends_on: [toonflow]
    ports:
      - "${MANGAFLOW_LAN_IP:-127.0.0.1}:3443:3443"
    environment:
      MANGAFLOW_LAN_IP: ${MANGAFLOW_LAN_IP:-127.0.0.1}
    volumes:
      - ./caddyLanConfig:/etc/caddy/Caddyfile:ro
      - caddyLanData:/data
      - caddyLanConfig:/config

volumes:
  toonflowData:
  caddyLanData:
  caddyLanConfig:
