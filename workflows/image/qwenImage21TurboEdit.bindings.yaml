workflow: ./qwenImage21TurboEditApi.json
label: Qwen-Image-2.1 Turbo 图像编辑
usage: 快速试改局部和参考组合，使用官方 Turbo 八步序列。第一张图是编辑底图，其余供参考，用 <image1> 至 <image10> 指代，写明改什么以及保留什么；画幅尽量贴近底图。 CFG 为 1，直接传提示词，负面提示词留空。
bindings:
- source: image_prompt
  target: 5.inputs.prompt
  kind: value
- source: params.width
  target: 6.inputs.width
  kind: value
- source: params.height
  target: 6.inputs.height
  kind: value
- source: seed
  target: 7.inputs.noise_seed
  kind: value
- source: refs.slot1
  target: 21.inputs.image
  kind: image
- source: refs.slot2
  target: 22.inputs.image
  kind: image
  required: false
