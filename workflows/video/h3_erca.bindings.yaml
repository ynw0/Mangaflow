workflow: ./h3_erca_api.json
# 二采 MiniMax H3：9 张参考图 + 视频/音频；duration 走 PrimitiveFloat 秒（合同常用 2–15）。
# H3 节点支持 ref_image_0..8（9 槽）；官方同款。
capabilities:
  duration_seconds:
    min: 2
    max: 15
