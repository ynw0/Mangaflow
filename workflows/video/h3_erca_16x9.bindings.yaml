workflow: ./h3_erca_16x9_api.json
prompt_format: h3Ref2va
usage: 横屏 16:9 的 H3 二次采样成片。支持参考素材和可选采样参数，按 H3 Ref2VA 组织连续动作和参考关系。
label: 二采 MiniMax H3 16:9
# 二采 MiniMax H3（16:9）：9 槽参考图 + 视频/音频；duration 经 PrimitiveFloat 注入（官方输出秒 4–15）。
# H3 节点支持 ref_image_0..8（9 槽）；节点 id 与旧 h3_erca 对齐。
capabilities:
  duration_seconds:
    min: 4
    max: 15
bindings:
- source: prompt
  target: 6.inputs.prompt
  kind: value
- source: seed
  target: 12.inputs.seed
  kind: value
- source: duration
  target: 17.inputs.value
  kind: value
- source: aspect_ratio
  target: 8.inputs.aspect_ratio
  kind: value
  required: false
- source: megapixels
  target: 8.inputs.megapixels
  kind: value
  required: false
- source: upscale
  target: 151.inputs.value
  kind: value
  required: false
# 一采写入节点 150，二采写入节点 148。总步数仍由节点 149 的 a+b 计算。
- source: first_pass_steps
  target: 150.inputs.value
  kind: value
  required: false
- source: second_pass_steps
  target: 148.inputs.value
  kind: value
  required: false
- source: refs.slot1
  target: 24.inputs.image
  kind: image
- source: refs.slot2
  target: 15.inputs.image
  kind: image
  required: false
- source: refs.slot3
  target: 123.inputs.image
  kind: image
  required: false
- source: refs.slot4
  target: 130.inputs.image
  kind: image
  required: false
- source: refs.slot5
  target: 132.inputs.image
  kind: image
  required: false
- source: refs.slot6
  target: 133.inputs.image
  kind: image
  required: false
- source: refs.slot7
  target: 159.inputs.image
  kind: image
  required: false
- source: refs.slot8
  target: 160.inputs.image
  kind: image
  required: false
- source: refs.slot9
  target: 161.inputs.image
  kind: image
  required: false
- source: media.video1
  target: 135.inputs.video
  kind: video
  required: false
- source: media.audio1
  target: 27.inputs.audio
  kind: audio
  required: false
- source: media.audio2
  target: 41.inputs.audio
  kind: audio
  required: false
- source: media.audio3
  target: 134.inputs.audio
  kind: audio
  required: false