workflow: ./h3_flf_repair_api.json
prompt_format: h3Frames
usage: 已有确定首帧和尾帧时修复两帧之间的连续动作，使用 H3 首尾帧格式和固定的起止构图。
bindings:
- source: prompt
  target: 105:104.inputs.prompt
  kind: value
- source: seed
  target: 105:15.inputs.noise_seed
  kind: value
- source: params.width
  target: 105:104.inputs.width
  kind: value
  required: false
- source: params.height
  target: 105:104.inputs.height
  kind: value
  required: false
- source: refs.first_frame
  target: 114.inputs.image
  kind: image
- source: refs.last_frame
  target: 128.inputs.image
  kind: image
